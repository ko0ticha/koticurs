<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Перенаправление...</title>
  <script>
    // GitHub Pages SPA redirect
    var path = window.location.pathname;
    var search = window.location.search;
    var hash = window.location.hash;
    var repoPath = path.split('/')[1] ? '/' + path.split('/')[1] + '/' : '/';
    window.location.replace(repoPath + 'index.html' + search + hash);
  </script>
</head>
<body>
  <p>Загрузка страницы курсов...</p>
</body>
</html>
